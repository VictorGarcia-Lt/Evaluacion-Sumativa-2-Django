<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-label="Póster de Operación Cóndor">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="sombra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="55%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.55)"/>
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="url(#fondo)"/>
    <circle cx="80" cy="130" r="150" fill="#facc15" opacity="0.18"/>
    <circle cx="540" cy="790" r="190" fill="#ffffff" opacity="0.06"/>
    <circle cx="520" cy="150" r="60" fill="none" stroke="#facc15" stroke-width="6" opacity="0.75"/>
    <circle cx="300" cy="175" r="50" fill="none" stroke="#facc15" stroke-width="5" opacity="0.7"/>
    <circle cx="300" cy="175" r="90" fill="none" stroke="#facc15" stroke-width="5" opacity="0.7999999999999999"/>
    <circle cx="300" cy="175" r="130" fill="none" stroke="#facc15" stroke-width="5" opacity="0.8999999999999999"/>
    <line x1="300" y1="60" x2="300" y2="290" stroke="#facc15" stroke-width="5" opacity="0.8"/>
    <line x1="180" y1="175" x2="420" y2="175" stroke="#facc15" stroke-width="5" opacity="0.8"/>
  <rect width="600" height="900" fill="url(#sombra)"/>

  <!-- Género -->
  <rect x="180" y="48" width="240" height="46" rx="23" fill="rgba(255,255,255,0.15)" stroke="#facc15" stroke-width="2"/>
  <text x="300" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="20" font-weight="700" letter-spacing="2" fill="#ffffff">ACCIÓN</text>

  <!-- Título -->
    <text x="300" y="484" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800" fill="#ffffff" style="paint-order:stroke; stroke:rgba(0,0,0,.35); stroke-width:3px;">Operación</text>
    <text x="300" y="556" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800" fill="#ffffff" style="paint-order:stroke; stroke:rgba(0,0,0,.35); stroke-width:3px;">Cóndor</text>

  <!-- Año -->
  <text x="300" y="673" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="26" font-weight="600" fill="#facc15">2023</text>

  <line x1="220" y1="707" x2="380" y2="707" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>

  <!-- Marca -->
  <text x="300" y="855" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="20" font-weight="700" letter-spacing="6" fill="rgba(255,255,255,0.85)">CINE CATÁLOGO</text>
</svg>
