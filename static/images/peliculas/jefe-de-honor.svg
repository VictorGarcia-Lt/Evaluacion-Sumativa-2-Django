<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-label="Póster de Jefe de honor">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3a47"/>
      <stop offset="100%" stop-color="#1d6f8c"/>
    </linearGradient>
    <linearGradient id="sombra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="55%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.55)"/>
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="url(#fondo)"/>
    <circle cx="80" cy="130" r="150" fill="#ffb703" opacity="0.18"/>
    <circle cx="540" cy="790" r="190" fill="#ffffff" opacity="0.06"/>
    <circle cx="520" cy="150" r="60" fill="none" stroke="#ffb703" stroke-width="6" opacity="0.75"/>
    <rect x="90" y="120" width="46" height="16" rx="8" fill="#ffb703" opacity="0.85" transform="rotate(-20 90 120)"/>
    <rect x="190" y="70" width="46" height="16" rx="8" fill="#ffffff" opacity="0.85" transform="rotate(15 190 70)"/>
    <rect x="430" y="110" width="46" height="16" rx="8" fill="#ffb703" opacity="0.85" transform="rotate(30 430 110)"/>
    <rect x="510" y="240" width="46" height="16" rx="8" fill="#ffffff" opacity="0.85" transform="rotate(-35 510 240)"/>
    <rect x="140" y="250" width="46" height="16" rx="8" fill="#ffb703" opacity="0.85" transform="rotate(25 140 250)"/>
  <rect width="600" height="900" fill="url(#sombra)"/>

  <!-- Género -->
  <rect x="180" y="48" width="240" height="46" rx="23" fill="rgba(255,255,255,0.15)" stroke="#ffb703" stroke-width="2"/>
  <text x="300" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="20" font-weight="700" letter-spacing="2" fill="#ffffff">COMEDIA</text>

  <!-- Título -->
    <text x="300" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#ffffff" style="paint-order:stroke; stroke:rgba(0,0,0,.35); stroke-width:3px;">Jefe de honor</text>

  <!-- Año -->
  <text x="300" y="629" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="26" font-weight="600" fill="#ffb703">2026</text>

  <line x1="220" y1="663" x2="380" y2="663" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>

  <!-- Marca -->
  <text x="300" y="855" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="20" font-weight="700" letter-spacing="6" fill="rgba(255,255,255,0.85)">CINE CATÁLOGO</text>
</svg>
