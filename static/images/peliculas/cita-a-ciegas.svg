<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-label="Póster de Cita a ciegas">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b1e6e"/>
      <stop offset="100%" stop-color="#a4399b"/>
    </linearGradient>
    <linearGradient id="sombra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="55%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.55)"/>
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="url(#fondo)"/>
    <circle cx="80" cy="130" r="150" fill="#ff8fab" opacity="0.18"/>
    <circle cx="540" cy="790" r="190" fill="#ffffff" opacity="0.06"/>
    <circle cx="520" cy="150" r="60" fill="none" stroke="#ff8fab" stroke-width="6" opacity="0.75"/>
    <path d="M300 240 c-70 -60 -130 -110 -130 -165 c0 -45 60 -60 90 -20 l40 45 l40 -45 c30 -40 90 -25 90 20 c0 55 -60 105 -130 165 Z" fill="#ff8fab" opacity="0.9"/>
  <rect width="600" height="900" fill="url(#sombra)"/>

  <!-- Género -->
  <rect x="180" y="48" width="240" height="46" rx="23" fill="rgba(255,255,255,0.15)" stroke="#ff8fab" stroke-width="2"/>
  <text x="300" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="20" font-weight="700" letter-spacing="2" fill="#ffffff">COMEDIA</text>

  <!-- Título -->
    <text x="300" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#ffffff" style="paint-order:stroke; stroke:rgba(0,0,0,.35); stroke-width:3px;">Cita a ciegas</text>

  <!-- Año -->
  <text x="300" y="629" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="26" font-weight="600" fill="#ff8fab">2023</text>

  <line x1="220" y1="663" x2="380" y2="663" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>

  <!-- Marca -->
  <text x="300" y="855" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="20" font-weight="700" letter-spacing="6" fill="rgba(255,255,255,0.85)">CINE CATÁLOGO</text>
</svg>
