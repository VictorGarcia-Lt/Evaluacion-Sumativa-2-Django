<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-label="Póster de El Camino de Regreso">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="sombra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="55%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.55)"/>
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="url(#fondo)"/>
    <circle cx="80" cy="130" r="150" fill="#e0f2fe" opacity="0.18"/>
    <circle cx="540" cy="790" r="190" fill="#ffffff" opacity="0.06"/>
    <circle cx="520" cy="150" r="60" fill="none" stroke="#e0f2fe" stroke-width="6" opacity="0.75"/>
    <path d="M60 330 C 180 90, 420 300, 540 130" fill="none" stroke="#e0f2fe" stroke-width="14" opacity="0.75" stroke-linecap="round" stroke-dasharray="2 26"/>
  <rect width="600" height="900" fill="url(#sombra)"/>

  <!-- Género -->
  <rect x="180" y="48" width="240" height="46" rx="23" fill="rgba(255,255,255,0.15)" stroke="#e0f2fe" stroke-width="2"/>
  <text x="300" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="20" font-weight="700" letter-spacing="2" fill="#ffffff">DRAMA</text>

  <!-- Título -->
    <text x="300" y="484" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800" fill="#ffffff" style="paint-order:stroke; stroke:rgba(0,0,0,.35); stroke-width:3px;">El Camino de</text>
    <text x="300" y="556" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800" fill="#ffffff" style="paint-order:stroke; stroke:rgba(0,0,0,.35); stroke-width:3px;">Regreso</text>

  <!-- Año -->
  <text x="300" y="673" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="26" font-weight="600" fill="#e0f2fe">2025</text>

  <line x1="220" y1="707" x2="380" y2="707" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>

  <!-- Marca -->
  <text x="300" y="855" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="20" font-weight="700" letter-spacing="6" fill="rgba(255,255,255,0.85)">CINE CATÁLOGO</text>
</svg>
